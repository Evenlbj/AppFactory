name: app-factory

services:
  # --- 1. BASE DE DONNÉES (MARIADB) ---
  db:
    image: mariadb:11.2
    container_name: app_factory_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_factory
      MARIADB_DATABASE: app_factory_db
      MARIADB_USER: factory_user
      MARIADB_PASSWORD: user_password_factory
    ports:
      - "3306:3306"
    volumes:
      - ./bdd_data:/var/lib/mysql

  # --- 2. MONITORING (CADVISOR) ---
  monitoring:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: app_factory_monitoring
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # --- 3. BACKUP AUTOMATIQUE (SAUVEGARDE) ---
  backup:
    image: fradelg/mysql-cron-backup:latest
    container_name: app_factory_backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password_factory
      CRON_TIME: "0 0 * * *"
      MAX_BACKUPS: 7
      INIT_BACKUP: "true"
    volumes:
      - ./backups:/backup
